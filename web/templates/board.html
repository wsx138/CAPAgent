<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF-Agent 黑板</title>
    <link href="https://cdn.jsdelivr.net/npm/element-plus@2.4.0/dist/index.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-plus@2.4.0/dist/index.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; padding-top: 56px; }
        .header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%); color: #fff; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header h1 { font-size: 18px; }
        .nav-links { display: flex; gap: 8px; }
        .nav-link { padding: 6px 16px; color: rgba(255,255,255,0.85); text-decoration: none; border-radius: 4px; font-size: 14px; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.2); color: #fff; }
        .main-layout { display: flex; height: calc(100vh - 56px); }
        .sidebar { width: 280px; background: #fff; border-right: 1px solid #e8e8e8; display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #e8e8e8; font-size: 13px; color: #666; }
        .task-list { flex: 1; overflow-y: auto; padding: 8px; }
        .task-item { background: #fafafa; border: 1px solid #e8e8e8; border-radius: 4px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
        .task-item:hover { border-color: #1890ff; }
        .task-item.active { border-color: #1890ff; background: #e6f7ff; }
        .task-url { font-size: 12px; color: #333; word-break: break-all; margin-bottom: 4px; }
        .task-meta { font-size: 11px; color: #999; }
        .content { flex: 1; overflow-y: auto; padding: 16px; }
        .panel { background: #fff; border-radius: 6px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .panel-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #333; display: flex; align-items: center; gap: 8px; }
        .empty { color: #999; font-size: 13px; padding: 12px 0; }
        .summary-text { font-family: Consolas, Monaco, monospace; font-size: 13px; background: #f6f8fa; padding: 10px; border-radius: 4px; color: #096dd9; }
        .kind-group { margin-bottom: 14px; }
        .kind-label { font-size: 12px; color: #666; margin-bottom: 6px; font-weight: 500; }
        .fact-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px dashed #f0f0f0; font-size: 13px; }
        .fact-row:last-child { border-bottom: none; }
        .fact-desc { flex: 1; word-break: break-all; }
        .fact-score { font-size: 11px; color: #999; white-space: nowrap; }
        .bar { height: 4px; background: #f0f0f0; border-radius: 2px; width: 60px; overflow: hidden; }
        .bar-inner { height: 100%; background: #52c41a; }
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <h1>CTF-Agent 黑板</h1>
        <div class="nav-links">
            <a href="/fisher_ctf_agent/monitor" class="nav-link">控制台</a>
            <a href="/fisher_ctf_agent/modules" class="nav-link">模块</a>
            <a href="/fisher_ctf_agent/topology" class="nav-link">拓扑</a>
            <a href="/fisher_ctf_agent/board" class="nav-link active">黑板</a>
        </div>
    </div>

    <div class="main-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                任务列表
                <el-button size="small" text @click="loadTasks" style="float:right">刷新</el-button>
            </div>
            <div class="task-list">
                <div v-for="t in taskList" :key="t.task_id"
                     class="task-item" :class="{active: t.task_id === selectedId}"
                     @click="selectTask(t.task_id)">
                    <div class="task-url">{{ t.target_url || t.task_id }}</div>
                    <div class="task-meta">
                        <span>{{ t.status }}</span>
                        <span v-if="t.found_flag" style="color:#52c41a">已找到 flag</span>
                    </div>
                </div>
                <div v-if="!taskList.length" class="empty">暂无任务</div>
            </div>
        </aside>

        <main class="content">
            <div v-if="!selectedId" class="empty">← 从左侧选择一个任务查看黑板</div>

            <template v-else>
                <div v-if="loadError" class="panel">
                    <div class="panel-title">⚠️ 无法读取</div>
                    <div class="empty">{{ loadError }}</div>
                </div>

                <template v-else>
                    <div class="panel">
                        <div class="panel-title">
                            黑板摘要
                            <el-tag v-if="board.enabled" type="success" size="small">已启用</el-tag>
                            <el-tag v-else type="info" size="small">未启用 / 无数据</el-tag>
                        </div>
                        <div v-if="board.summary" class="summary-text">{{ board.summary }}</div>
                        <div v-else class="empty">
                            黑板未启用（config.yaml 中 <code>ENABLE_BOARD: false</code>），或任务尚未产出事实。
                        </div>
                    </div>

                    <div class="panel" v-if="factGroups.length">
                        <div class="panel-title">结构化事实（{{ board.facts.length }}）</div>
                        <div v-for="g in factGroups" :key="g.kind" class="kind-group">
                            <div class="kind-label">{{ g.kind }} ({{ g.items.length }})</div>
                            <div v-for="f in g.items" :key="f.id" class="fact-row">
                                <el-tag size="small" effect="plain">{{ f.kind }}</el-tag>
                                <span class="fact-desc">{{ f.description }}</span>
                                <span class="fact-score">
                                    价值 {{ (f.value_score || 0).toFixed(2) }}
                                    · 置信 {{ (f.confidence || 0).toFixed(2) }}
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="panel" v-if="board.intents && board.intents.length">
                        <div class="panel-title">探索意图（{{ board.intents.length }}）</div>
                        <el-table :data="board.intents" size="small" style="width:100%">
                            <el-table-column prop="description" label="方向" min-width="240" />
                            <el-table-column prop="status" label="状态" width="110" />
                            <el-table-column label="优先级" width="90">
                                <template #default="s">{{ (s.row.priority || 0).toFixed(2) }}</template>
                            </el-table-column>
                            <el-table-column prop="skill" label="技能" width="140" />
                        </el-table>
                    </div>

                    <div class="panel" v-if="board.skill_hits && board.skill_hits.length">
                        <div class="panel-title">技能命中（{{ board.skill_hits.length }}）</div>
                        <div v-for="sk in board.skill_hits" :key="sk.name" class="fact-row">
                            <el-tag size="small" type="warning" effect="plain">{{ sk.name }}</el-tag>
                            <span class="fact-desc">{{ sk.description }}</span>
                            <span class="fact-score">{{ (sk.tools || []).join(', ') }}</span>
                        </div>
                    </div>
                </template>
            </template>
        </main>
    </div>
</div>

<script>
const API = '/fisher_ctf_agent';
const { createApp } = Vue;

createApp({
    data() {
        return {
            taskList: [],
            selectedId: null,
            board: { facts: [], intents: [], skill_hits: [], summary: '', enabled: false },
            loadError: '',
        };
    },
    computed: {
        factGroups() {
            const groups = {};
            for (const f of (this.board.facts || [])) {
                const k = f.kind || 'unknown';
                (groups[k] = groups[k] || []).push(f);
            }
            return Object.keys(groups).sort().map(k => ({ kind: k, items: groups[k] }));
        },
    },
    methods: {
        async loadTasks() {
            try {
                const r = await fetch(`${API}/api/tasks`);
                const d = await r.json();
                this.taskList = Array.isArray(d) ? d : (d.tasks || []);
            } catch (e) {
                this.taskList = [];
            }
        },
        async selectTask(id) {
            this.selectedId = id;
            this.loadError = '';
            this.board = { facts: [], intents: [], skill_hits: [], summary: '', enabled: false };
            try {
                const r = await fetch(`${API}/api/board/${id}`);
                const d = await r.json();
                if (d.error) { this.loadError = d.error; return; }
                if (d.available === false) { this.loadError = d.message || '暂不可用'; return; }
                this.board = d;
            } catch (e) {
                this.loadError = '请求失败: ' + e.message;
            }
        },
    },
    mounted() {
        this.loadTasks();
    },
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
